<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMServices Holding — Mobile Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC;
    --paper-line:#E6DDC6;
    --ink:#1F2421;
    --ink-soft:#5B6259;
    --cover:#16332E;
    --cover-light:#1F4941;
    --gold:#C98A2B;
    --gold-light:#E0A94E;
    --rust:#B23A22;
    --rust-soft:#F3DED7;
    --green-soft:#DCE8D6;
    --green-ink:#2F5233;
    --brand-blue:#2A4FA0;
    --brand-red:#B5322A;
    --plus:#2F5233;
    --plus-bg:#DCE8D6;
    --minus:#B23A22;
    --minus-bg:#F3DED7;
    --display:'Fraunces', serif;
    --body:'Inter', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:var(--body);color:var(--ink);background:var(--paper);}
  #app{display:flex;min-height:100vh;}

  /* ---- SIDEBAR ---- */
  .sidebar{
    width:262px;flex-shrink:0;background:var(--cover);color:#EFEAE0;
    display:flex;flex-direction:column;padding:24px 0 30px;position:relative;
  }
  .sidebar::after{
    content:"";position:absolute;top:0;right:0;bottom:0;width:6px;
    background:repeating-linear-gradient(180deg,var(--gold) 0 10px, transparent 10px 20px);
    opacity:.55;
  }
  .brand{padding:4px 22px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px;}
  .brand .logo-desktop{width:100%;max-width:190px;border-radius:8px;background:#fff;padding:10px 12px;display:block;}
  .brand .logo-mobile{display:none;}
  .brand .sub{font-family:var(--mono);font-size:10.5px;color:#9FB3AC;margin-top:12px;letter-spacing:.14em;text-transform:uppercase;}

  nav{display:flex;flex-direction:column;gap:2px;padding:0 12px;overflow-y:auto;}
  .nav-group{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
    color:#7C8A83;padding:16px 14px 6px;}
  nav button{
    all:unset;cursor:pointer;padding:10px 14px;border-radius:6px;
    font-family:var(--body);font-size:13.5px;font-weight:500;color:#D9D3C4;
    display:flex;align-items:center;gap:10px;justify-content:space-between;
  }
  nav button .lbl{display:flex;align-items:center;gap:10px;}
  nav button .idx{font-family:var(--mono);font-size:10.5px;color:#7C8A83;min-width:20px;}
  nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
  nav button.active{background:var(--gold);color:var(--cover);font-weight:600;}
  nav button.active .idx{color:var(--cover);opacity:.6;}
  .badge-alert{background:var(--rust);color:#fff;font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:20px;}

  /* ---- MAIN ---- */
  .content{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{
    padding:22px 40px;border-bottom:1px solid var(--paper-line);
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    background:repeating-linear-gradient(var(--paper) 0 27px, var(--paper-line) 27px 28px);
    background-size:100% 28px;
  }
  .topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
  .topbar .logo-mobile{display:none;height:34px;border-radius:6px;background:#fff;padding:3px 6px;}
  .topbar h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0;line-height:1.1;}
  .topbar .today{font-family:var(--mono);font-size:12px;color:var(--ink-soft);white-space:nowrap;}
  .view{padding:30px 40px;}

  /* ---- STATS ---- */
  .stat-row{display:flex;gap:16px;margin-bottom:26px;flex-wrap:wrap;}
  .stat{background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:18px 20px;min-width:180px;flex:1;box-shadow:0 1px 0 var(--paper-line);}
  .stat .num{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--cover);}
  .stat .lbl{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .stat.warn .num{color:var(--rust);}

  /* ---- PANEL / TABLE ---- */
  .panel{background:#fff;border:1px solid var(--paper-line);border-radius:10px;overflow:hidden;margin-bottom:26px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--paper-line);flex-wrap:wrap;}
  .panel-head h2{font-family:var(--display);font-size:17px;font-weight:600;margin:0;}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);padding:10px 18px;border-bottom:1px solid var(--paper-line);white-space:nowrap;}
  tbody td{padding:11px 18px;border-bottom:1px solid var(--paper-line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBF8F1;}
  td.num, th.num{font-family:var(--mono);text-align:right;white-space:nowrap;}
  .empty-row td{text-align:center;color:var(--ink-soft);padding:26px;font-style:italic;}
  .avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--paper-line);background:var(--paper);}
  .avatar.ph{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--ink-soft);}

  .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-family:var(--mono);font-size:11px;font-weight:600;}
  .pill.solde{background:var(--green-soft);color:var(--green-ink);}
  .pill.partiel{background:#F5E7C9;color:#8A6316;}
  .pill.attente{background:#EAE6D9;color:var(--ink-soft);}
  .pill.alerte{background:var(--rust-soft);color:var(--rust);}
  .pill.retard{background:var(--rust);color:#fff;}
  .rzchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;}
  .rzdot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .signe.plus{color:var(--plus);font-weight:600;}
  .signe.minus{color:var(--minus);font-weight:600;}

  /* ---- BUTTONS ---- */
  .btn{all:unset;cursor:pointer;font-family:var(--body);font-weight:600;font-size:13px;padding:9px 16px;border-radius:6px;background:var(--gold);color:var(--cover);text-align:center;}
  .btn:hover{background:var(--gold-light);}
  .btn.ghost{background:transparent;border:1px solid var(--paper-line);color:var(--ink);}
  .btn.ghost:hover{border-color:var(--gold);}
  .btn.small{padding:6px 12px;font-size:12px;}
  .btn.danger{background:var(--rust-soft);color:var(--rust);}
  .btn.danger:hover{background:#EBC9C0;}
  .link{all:unset;cursor:pointer;color:var(--brand-blue);font-size:12.5px;font-weight:600;text-decoration:underline;text-underline-offset:2px;}
  .icon-btn{all:unset;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:5px;color:var(--ink-soft);}
  .icon-btn:hover{background:var(--paper);color:var(--rust);}

  /* ---- FORM ---- */
  form{display:block;}
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:20px;}
  .form-grid.three{grid-template-columns:repeat(3,1fr);}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .field input, .field select, .field textarea{
    font-family:var(--body);font-size:14px;padding:9px 11px;border:1px solid var(--paper-line);
    border-radius:6px;background:var(--paper);color:var(--ink);width:100%;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .field.span2{grid-column:span 2;}
  .field.span3{grid-column:1 / -1;}
  .form-actions{padding:0 20px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .msg{font-family:var(--mono);font-size:12px;padding:0 20px 14px;}
  .msg.ok{color:var(--green-ink);}
  .msg.err{color:var(--rust);}
  .section-label{grid-column:1 / -1;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border-bottom:1px dashed var(--paper-line);padding-bottom:6px;margin-top:4px;}

  /* photo upload */
  .photo-field{display:flex;flex-direction:column;gap:8px;}
  .photo-drop{display:flex;align-items:center;gap:12px;border:1px dashed var(--paper-line);border-radius:8px;padding:10px;background:var(--paper);}
  .photo-drop img{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--paper-line);background:#fff;}
  .photo-drop .ph{width:56px;height:56px;border-radius:6px;border:1px solid var(--paper-line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink-soft);}
  .photo-drop label.pick{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--brand-blue);text-decoration:underline;}

  .loading{padding:24px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);}

  /* dynamic rows */
  .rows{padding:0 20px 6px;}
  .drow{display:grid;gap:10px;align-items:end;padding:12px 0;border-bottom:1px dashed var(--paper-line);}
  .drow .field label{font-size:11px;}
  .drow-tournee{grid-template-columns:1.4fr 1fr 1fr 1.4fr 30px;}
  .drow-agence{grid-template-columns:1.6fr 1fr;}
  .addrow{margin:6px 20px 14px;}
  .totline{display:flex;justify-content:flex-end;gap:26px;padding:10px 20px 18px;font-family:var(--mono);font-size:13px;}
  .totline b{color:var(--cover);}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(22,51,46,.55);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto;}
  .overlay.open{display:flex;}
  .modal{background:var(--paper);border-radius:12px;max-width:640px;width:100%;border:1px solid var(--paper-line);box-shadow:0 24px 60px rgba(0,0,0,.28);overflow:hidden;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:var(--cover);color:#EFEAE0;}
  .modal-head h3{font-family:var(--display);font-size:19px;margin:0;}
  .modal-head .x{all:unset;cursor:pointer;font-size:20px;color:#EFEAE0;padding:2px 8px;border-radius:6px;}
  .modal-head .x:hover{background:rgba(255,255,255,.12);}
  .modal-body{padding:22px;}
  .detail-photos{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .detail-photos figure{margin:0;text-align:center;}
  .detail-photos img{width:150px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--paper-line);background:#fff;}
  .detail-photos figcaption{font-family:var(--mono);font-size:10px;color:var(--ink-soft);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;}
  .dl{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:13.5px;}
  .dl dt{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;padding-top:2px;}
  .dl dd{margin:0;color:var(--ink);}

  @media (max-width:900px){
    .form-grid, .form-grid.three{grid-template-columns:1fr;}
    .field.span2,.field.span3{grid-column:span 1;}
    .drow-tournee{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:820px){
    #app{flex-direction:column;}
    .sidebar{width:100%;flex-direction:column;padding:12px;}
    .sidebar::after{display:none;}
    .brand{display:none;}
    .nav-group{padding:10px 10px 4px;}
    nav{flex-direction:row;flex-wrap:wrap;padding:0;gap:6px;}
    nav button{padding:8px 12px;font-size:12.5px;}
    nav button .idx{display:none;}
    .topbar .logo-mobile{display:block;}
    .topbar h1{font-size:20px;}
    .topbar .today{display:none;}
    .view{padding:18px;}
    .topbar{padding:16px 18px;}
    .dl{grid-template-columns:1fr;}
    .dl dt{padding-top:8px;}
  }
</style>
</head>

<script>
const API = '';
const RESEAUX_AGENCE_EXTRA = 'Transfert d\'unité';

const NAV = [
  {group:'Opérations', items:[
    {id:'dashboard',   label:'Tableau de bord', idx:'00'},
    {id:'operations',  label:'Opérations UV',   idx:'01'},
    {id:'versements',  label:'Versements',       idx:'02'},
    {id:'alertes',     label:'Alertes',          idx:'03'},
    {id:'grandlivre',  label:'Grand livre +/−',  idx:'04'},
  ]},
  {group:'Rapports', items:[
    {id:'rapports',    label:'Écart de fonds',   idx:'05'},
    {id:'tournees',    label:'Tournées commercial', idx:'06'},
    {id:'agence',      label:'Ops. Agence (PDV)', idx:'07'},
  ]},
  {group:'Répertoire', items:[
    {id:'pdv',         label:'Points de vente',  idx:'08'},
    {id:'zones',       label:'Zones',            idx:'09'},
    {id:'commerciaux', label:'Commerciaux',      idx:'10'},
    {id:'masters',     label:'Masters',          idx:'11'},
    {id:'superviseurs',label:'Superviseurs',     idx:'12'},
  ]},
];
const ALL_ITEMS = NAV.flatMap(g=>g.items);

let S = { view:'dashboard', reseaux:[], masters:[], superviseurs:[], commerciaux:[], zones:[], pdv:[],
          operations:[], alertes:[], mouvements:[], soldes:[], rapports:[], tournees:[], agence:[], stats:{} };

/* ---------- utils ---------- */
const $ = (id)=>document.getElementById(id);
function fmt(n){ return Number(n||0).toLocaleString('fr-FR') + ' F'; }
function fmtSigne(n){ const v=Number(n||0); const s=v>0?'+':''; return s+v.toLocaleString('fr-FR')+' F'; }
function fmtDate(d){ if(!d) return '—'; return new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nomComplet(x){ return esc([x.nom, x.prenoms].filter(Boolean).join(' ')) || '—'; }
function initiales(x){ const a=(x.nom||'?')[0]||'?'; const b=(x.prenoms||'')[0]||''; return (a+b).toUpperCase(); }
function reseauChip(nom, couleur){ return `<span class="rzchip"><span class="rzdot" style="background:${couleur||'#999'}"></span>${esc(nom||'—')}</span>`; }

async function api(path, opts){
  const res = await fetch(API + path, opts);
  if(!res.ok){ const b = await res.json().catch(()=>({error:'Erreur inconnue'})); throw new Error(b.error||'Erreur serveur'); }
  return res.json();
}

/* compresse une image côté navigateur → base64 (max 1000px, qualité 0.72) */
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const max=1000; let {width:w, height:h}=img;
        if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',0.72));
      };
      img.onerror=reject; img.src=e.target.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}

/* ---------- chargement ---------- */
async function loadAll(){
  const [reseaux,masters,superviseurs,commerciaux,zones,pdv,operations,alertes,soldes,stats] = await Promise.all([
    api('/reseaux'),api('/masters'),api('/superviseurs'),api('/commerciaux'),api('/zones'),
    api('/pdv'),api('/operations'),api('/alertes'),api('/soldes'),api('/stats')
  ]);
  Object.assign(S,{reseaux,masters,superviseurs,commerciaux,zones,pdv,operations,alertes,soldes,stats});
}
async function loadView(view){
  try{
    if(view==='grandlivre') S.mouvements = await api('/mouvements');

/* ---------- navigation ---------- */
function renderNav(){
  $('nav').innerHTML = NAV.map(g=>`
    <div class="nav-group">${g.group}</div>
    ${g.items.map(it=>{
      const alert = it.id==='alertes' && S.alertes.length ? `<span class="badge-alert">${S.alertes.length}</span>` : '';
      return `<button data-view="${it.id}" class="${S.view===it.id?'active':''}">
        <span class="lbl"><span class="idx">${it.idx}</span>${it.label}</span>${alert}</button>`;
    }).join('')}
  `).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
}
async function setView(view){
  S.view = view;
  $('view-title').textContent = ALL_ITEMS.find(i=>i.id===view).label;
  $('view-root').innerHTML = `<div class="loading">Chargement…</div>`;
  renderNav();
  await loadView(view);
  renderView();
}
function renderView(){
  const R = {
    dashboard:renderDashboard, operations:renderOperations, versements:renderVersements,
    alertes:renderAlertes, grandlivre:renderGrandLivre, rapports:renderRapports,
    tournees:renderTournees, agence:renderAgence, pdv:renderPdv, zones:renderZones,
    commerciaux:()=>renderPersonnel('commerciaux'), masters:()=>renderPersonnel('masters'),
    superviseurs:()=>renderPersonnel('superviseurs')
  };
  $('view-root').innerHTML = R[S.view]();
  attachHandlers();
}

/* ================= PERSONNEL (commerciaux / masters / superviseurs) ================= */
function personnelConfig(t){
  if(t==='commerciaux') return {titre:'commercial', pieces:[['permis_recto','Pièce / permis (recto)'],['permis_verso','Pièce / permis (verso)']], zone:true};
  if(t==='masters')     return {titre:'master', pieces:[['piece_recto','Pièce d\'identité (recto)'],['piece_verso','Pièce d\'identité (verso)']], siege:true};
  return {titre:'superviseur', pieces:[['piece_recto','Pièce d\'identité (recto)'],['piece_verso','Pièce d\'identité (verso)']]};
}
function renderPersonnel(t){
  const cfg = personnelConfig(t);
  const list = S[t];
  return `
    <div class="panel">
      <div class="panel-head"><h2>Nouveau ${cfg.titre}</h2></div>
      <form data-form="${t}" data-refresh="${t}">
        <div class="form-grid">
          <div class="field"><label>Code (optionnel)</label><input type="text" name="code"></div>
          <div class="field"><label>Nom</label><input type="text" name="nom" required></div>
          <div class="field"><label>Prénoms</label><input type="text" name="prenoms"></div>
          <div class="field"><label>Contact</label><input type="text" name="contact"></div>
          ${cfg.siege?`<div class="field span2"><label>Adresse du siège</label><input type="text" name="adresse_siege"></div>`:''}
          <div class="section-label">Photos & pièces</div>
          ${photoField('photo','Photo du '+cfg.titre)}
          ${cfg.pieces.map(([f,l])=>photoField(f,l)).join('')}
        </div>
        <div class="msg" data-msg></div>
        <div class="form-actions"><button class="btn" type="submit">Créer le ${cfg.titre}</button></div>
      </form>
    </div>
    <div class="panel"><div class="panel-head"><h2>Tous les ${t}</h2><span class="today">${list.length}</span></div><div class="table-wrap">
      ${!list.length?emptyTable("Aucun "+cfg.titre):`<table><thead><tr><th></th><th>Nom & prénoms</th><th>Contact</th>${cfg.zone?'<th>Zone(s)</th>':''}<th></th></tr></thead>
      <tbody>${list.map(x=>{
        const zones = cfg.zone ? S.zones.filter(z=>z.commercial_id===x.id).map(z=>esc(z.nom)).join(', ') : '';
        return `<tr>
          <td><div class="avatar ph">${initiales(x)}</div></td>
          <td>${nomComplet(x)}${x.code?` <span class="today">#${esc(x.code)}</span>`:''}</td>
          <td>${esc(x.contact||'—')}</td>${cfg.zone?`<td>${zones||'—'}</td>`:''}
          <td><button class="link" data-detail="${t}:${x.id}">Fiche</button> · <button class="icon-btn" data-del="/${t}/${x.id}" data-refresh="${t}" title="Supprimer">🗑</button></td></tr>`;
      }).join('')}</tbody></table>`}
    </div></div>`;
}

/* ---------- helpers de rendu ---------- */
function emptyTable(txt){ return `<table><tbody><tr class="empty-row"><td>${txt}</td></tr></tbody></table>`; }
function photoField(field,label){
  return `<div class="field photo-field">
    <label>${label}</label>
    <div class="photo-drop">
      <div class="ph" data-preview="${field}">📷</div>
      <label class="pick">Choisir une image
        <input type="file" accept="image/*" data-photo="${field}" style="display:none">
      </label>
    </div>
  </div>`;
}

/* ---------- handlers ---------- */
const PHOTOS = {}; // stocke les base64 par champ pour le formulaire courant

function attachHandlers(){
  Object.keys(PHOTOS).forEach(k=>delete PHOTOS[k]);

  document.querySelectorAll('button[data-view]').forEach(b=>{ if(!b.closest('nav')) b.addEventListener('click',()=>setView(b.dataset.view)); });

  // uploads photo
  document.querySelectorAll('input[data-photo]').forEach(inp=>{
    inp.addEventListener('change', async e=>{
      const f=e.target.files[0]; if(!f) return;
      const field=inp.dataset.photo;
      try{
        const b64=await compressImage(f);
        PHOTOS[field]=b64;
        const prev=document.querySelector(`[data-preview="${field}"]`);
        if(prev){ prev.outerHTML=`<img src="${b64}" data-preview="${field}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--paper-line);">`; }
      }catch(err){ alert('Image illisible : '+err.message); }
    });
  });

  // initiateur → agents (opérations)
  const initSel=document.querySelector('select[data-initiateur]');
  if(initSel){ initSel.addEventListener('change',()=>{ const a=document.querySelector('select[data-agent]'); a.innerHTML=agentOptions(initSel.value); }); }

  // mode versement → réseau
  const modeSel=document.querySelector('select[data-mode]');
  if(modeSel){ const wrap=document.querySelector('[data-wrap-reseau]'); const tg=()=>wrap.style.display=modeSel.value==='UV'?'flex':'none'; tg(); modeSel.addEventListener('change',tg); }

  // lignes dynamiques : tournée
  const trows=document.querySelector('[data-rows="tournee"]');
  if(trows){ addTourneeRow(); document.querySelector('[data-addrow="tournee"]').addEventListener('click',addTourneeRow); }

  // totaux agence (live)
  if(document.querySelector('[data-rows="agence"]')) bindAgenceTotals();

  // formulaires
  document.querySelectorAll('form[data-form]').forEach(f=>f.addEventListener('submit',handleSubmit));

  // suppressions
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>handleDelete(b.dataset.del,b.dataset.refresh)));

  // détails
  document.querySelectorAll('[data-detail]').forEach(b=>b.addEventListener('click',()=>openDetail(b.dataset.detail)));
  document.querySelectorAll('[data-detail-tournee]').forEach(b=>b.addEventListener('click',()=>openTourneeDetail(b.dataset.detailTournee)));
  document.querySelectorAll('[data-detail-agence]').forEach(b=>b.addEventListener('click',()=>openAgenceDetail(b.dataset.detailAgence)));
}

function addTourneeRow(){
  const rows=document.querySelector('[data-rows="tournee"]');
  const div=document.createElement('div'); div.innerHTML=tourneeRowHTML(); const row=div.firstElementChild;
  rows.appendChild(row);
  row.querySelector('[data-rmrow]').addEventListener('click',()=>{ row.remove(); computeTourneeTotals(); });
  row.querySelectorAll('[data-sum]').forEach(i=>i.addEventListener('input',computeTourneeTotals));
  computeTourneeTotals();
}
function computeTourneeTotals(){
  let tot=0;
  document.querySelectorAll('[data-rows="tournee"] [data-sum]').forEach(i=>tot+=Number(i.value)||0);
  const rev=Number(document.querySelector('input[name="montant_reverse"]').value)||0;
  const c=document.querySelector('[data-tot-collecte]'), r=document.querySelector('[data-tot-reste]');
  if(c) c.textContent=fmt(tot); if(r) r.textContent=fmt(Math.max(0,tot-rev));
}
function bindAgenceTotals(){
  const recalc=()=>{
    let uv=0; document.querySelectorAll('[data-aguv]').forEach(i=>uv+=Number(i.value)||0);
    const esp=Number(document.querySelector('input[name="espece_encaisse"]').value)||0;
    const tr=Number(document.querySelector('input[name="transfert_unite"]').value)||0;
    document.querySelector('[data-ag-tot-uv]').textContent=fmt(uv);
    document.querySelector('[data-ag-tot]').textContent=fmt(uv+esp+tr);
  };
  document.querySelectorAll('[data-aguv],[data-agsum]').forEach(i=>i.addEventListener('input',recalc));
  recalc();
  const mr=document.querySelector('input[name="montant_reverse"]'); // (tournée) — sans effet ici
}

// écoute le champ "montant_reverse" pour recalcul tournée
document.addEventListener('input',e=>{ if(e.target && e.target.name==='montant_reverse') computeTourneeTotals(); });

async function handleSubmit(e){
  e.preventDefault();
  const form=e.target;
  const type=form.dataset.form;
  const refresh=form.dataset.refresh;
  const msg=form.querySelector('[data-msg]');
  msg.textContent='Enregistrement…'; msg.className='msg';
  try{
    const payload=buildPayload(type,form);
    const endpoint=ENDPOINTS[type];
    await api(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    msg.textContent='✔ Enregistré avec succès'; msg.className='msg ok';
    await loadAll();
    await loadView(S.view);
    renderNav(); renderView();
    // remettre le focus + message de succès après re-render impossible (nouvelle vue) → ok
  }catch(err){ msg.textContent='✘ '+err.message; msg.className='msg err'; }
}

const ENDPOINTS={ operation:'/operations', versement:'/versements', mouvement:'/mouvements',
  rapport:'/rapports-ecart', tournee:'/tournees', agence:'/agence-ops',
  pdv:'/pdv', zone:'/zones', commerciaux:'/commerciaux', masters:'/masters', superviseurs:'/superviseurs' };

function buildPayload(type,form){
  const d=Object.fromEntries(new FormData(form).entries());
  // photos
  Object.assign(d,PHOTOS);

  if(type==='mouvement'){ const [at,ai]=(d.acteur||'').split(':'); return {acteur_type:at,acteur_id:ai,sens:d.sens,montant:d.montant,motif:d.motif,date_mouvement:d.date_mouvement||null}; }
  if(type==='rapport'){ const [et,ei]=(d.entite||'').split(':'); return {entite_type:et,entite_id:ei,date_rapport:d.date_rapport||null,solde_jour:d.solde_jour,solde_soir:d.solde_soir,motif:d.motif}; }
  if(type==='tournee'){
    const lignes=[...document.querySelectorAll('[data-rows="tournee"] .drow')].map(row=>({
      pdv_id:row.querySelector('[data-k="pdv_id"]').value,
      remise_retour:row.querySelector('[data-k="remise_retour"]').value,
      espece_achat:row.querySelector('[data-k="espece_achat"]').value,
      observation:row.querySelector('[data-k="observation"]').value
    }));
    return {commercial_id:d.commercial_id,date_tournee:d.date_tournee||null,montant_reverse:d.montant_reverse||0,note:d.note,lignes};
  }
  if(type==='agence'){
    const lignes=[...document.querySelectorAll('[data-reseau]')].map(i=>({reseau_id:i.dataset.reseau,montant_uv:i.value})).filter(l=>Number(l.montant_uv)>0);
    return {pdv_id:d.pdv_id,date_op:d.date_op||null,periode:d.periode,espece_encaisse:d.espece_encaisse||0,transfert_unite:d.transfert_unite||0,lignes};
  }
  return d; // operation, versement, pdv, zone, personnel
}

async function handleDelete(endpoint,refresh){
  if(!confirm('Supprimer cet élément ? Cette action est définitive.')) return;
  try{
    await api(endpoint,{method:'DELETE'});
    await loadAll(); await loadView(S.view); renderNav(); renderView();
  }catch(err){ alert('Suppression impossible : '+err.message); }
}

/* ---------- MODALE DETAIL ---------- */
function openModal(title,html){ $('modal-title').textContent=title; $('modal-body').innerHTML=html; $('overlay').classList.add('open'); }
function closeModal(){ $('overlay').classList.remove('open'); }
$('modal-close').addEventListener('click',closeModal);
$('overlay').addEventListener('click',e=>{ if(e.target===$('overlay')) closeModal(); });

async function openDetail(ref){
  const [table,id]=ref.split(':');
  openModal('Chargement…','<div class="loading">Chargement de la fiche…</div>');
  try{
    const x=await api(`/${table}/${id}`);
    if(table==='pdv') openModal('Fiche — '+(x.nom_commercial||x.nom), pdvDetailHTML(x));
    else openModal('Fiche — '+[x.nom,x.prenoms].filter(Boolean).join(' '), personnelDetailHTML(table,x));
  }catch(err){ openModal('Erreur',`<div class="msg err">${err.message}</div>`); }
}
function photoFig(src,cap){ return src?`<figure><img src="${src}" alt="${cap}"><figcaption>${cap}</figcaption></figure>`:''; }
function dl(rows){ return `<dl class="dl">${rows.filter(r=>r[1]).map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl>`; }

function pdvDetailHTML(p){
  const gps=(p.gps_lat&&p.gps_lng)?`${p.gps_lat}, ${p.gps_lng}`:'';
  return `<div class="detail-photos">${photoFig(p.photo_responsable,'Responsable')}${photoFig(p.photo_local,'Local')}</div>
    ${dl([['Identifiant',p.identifiant],['Nom commercial',p.nom_commercial||p.nom],['Zone',p.zone_nom],
      ['Ville',p.ville],['Quartier',p.quartier],['Situation',p.situation_geo],['GPS',gps],
      ['Proximité siège',p.est_proche_siege?'Proche':'Éloigné'],
      ['Responsable',p.nom_responsable],['Contact resp.',p.contact_responsable],
      ['Gérant',p.nom_gerant],['Contact gérant',p.contact_gerant]])}`;
}
function personnelDetailHTML(table,x){
  const p1 = table==='commerciaux' ? x.permis_recto : x.piece_recto;
  const p2 = table==='commerciaux' ? x.permis_verso : x.piece_verso;
  const zones = table==='commerciaux' ? S.zones.filter(z=>z.commercial_id===x.id).map(z=>z.nom).join(', ') : '';
  return `<div class="detail-photos">${photoFig(x.photo,'Photo')}${photoFig(p1,'Pièce recto')}${photoFig(p2,'Pièce verso')}</div>
    ${dl([['Code',x.code],['Nom',x.nom],['Prénoms',x.prenoms],['Contact',x.contact],
      ['Adresse siège',x.adresse_siege],['Zone(s)',zones]])}`;
}

async function openTourneeDetail(id){
  openModal('Chargement…','<div class="loading">…</div>');
  try{
    const t=await api(`/tournees/${id}`);
    const rows=(t.lignes||[]).map(l=>`<tr><td>${esc(l.pdv_nom||'—')}</td><td class="num">${fmt(l.remise_retour)}</td><td class="num">${fmt(l.espece_achat)}</td><td>${esc(l.observation||'—')}</td></tr>`).join('');
    openModal('Tournée — '+(t.commercial_nom||''),
      `${dl([['Date',fmtDate(t.date_tournee)],['Commercial',[t.commercial_nom,t.commercial_prenoms].filter(Boolean).join(' ')],['Reversé au master',fmt(t.montant_reverse)],['Note',t.note]])}
       <div class="table-wrap" style="margin-top:14px;"><table><thead><tr><th>PDV</th><th class="num">Remise/Retour</th><th class="num">Espèce/Achat UV</th><th>Observation</th></tr></thead><tbody>${rows||'<tr class="empty-row"><td colspan=4>Aucune ligne</td></tr>'}</tbody></table></div>`);
  }catch(err){ openModal('Erreur',`<div class="msg err">${err.message}</div>`); }
}
async function openAgenceDetail(id){
  openModal('Chargement…','<div class="loading">…</div>');
  try{
    const a=await api(`/agence-ops/${id}`);
    const rows=(a.lignes||[]).map(l=>`<tr><td>${reseauChip(l.reseau_nom,l.reseau_couleur)}</td><td class="num">${fmt(l.montant_uv)}</td></tr>`).join('');
    openModal('Point agence — '+(a.pdv_nom||''),
      `${dl([['Date',fmtDate(a.date_op)],['PDV',a.pdv_nom],['Période',a.periode],['Espèce encaissée',fmt(a.espece_encaisse)],['Transfert d\'unité',fmt(a.transfert_unite)]])}
       <div class="table-wrap" style="margin-top:14px;"><table><thead><tr><th>Réseau</th><th class="num">Montant UV</th></tr></thead><tbody>${rows||'<tr class="empty-row"><td colspan=2>Aucune UV</td></tr>'}</tbody></table></div>`);
  }catch(err){ openModal('Erreur',`<div class="msg err">${err.message}</div>`); }
}

/* ---------- INIT ---------- */
async function init(){
  $('today').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  try{ await loadAll(); }
  catch(err){
    $('view-root').innerHTML=`<div class="panel"><div class="panel-head"><h2>Erreur de connexion</h2></div><div class="msg err" style="padding:20px;">${err.message}<br><br>Vérifie que le serveur tourne et que la base est connectée (essaie /health).</div></div>`;
    renderNav(); return;
  }
  renderNav();
  await loadView('dashboard');
  renderView();
}
init();
</script>
