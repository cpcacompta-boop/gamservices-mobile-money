<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAMServices Holding</title>
<style>
  :root{
    --bg:#EEF1F8; --surface:#FFFFFF; --surface-2:#F6F8FC;
    --ink:#111A33; --ink-soft:#59657F; --ink-faint:#94A0BC;
    --brand:#2A4FA0; --brand-2:#3A62BE; --brand-deep-1:#1E2E5C; --brand-deep-2:#162143;
    --red:#B5322A; --gold:#C89B3C;
    --line:#E5EAF3;
    --display:Arial,'Helvetica Neue',sans-serif; --body:Arial,'Helvetica Neue',sans-serif; --mono:Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--body);font-size:12px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;}

  /* ---- LOGIN ---- */
  #login-screen{display:block;background:var(--bg);}
  .login-wrap{display:flex;width:100%;min-height:100vh;min-height:100dvh;}
  .login-brand{flex:1;position:relative;overflow:hidden;background:linear-gradient(155deg,var(--brand-deep-1),var(--brand-deep-2));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px;}
  .login-brand::before{content:"";position:absolute;width:150%;height:150%;top:-25%;left:-25%;background:radial-gradient(circle at 30% 30%,rgba(58,98,190,.45),transparent 45%),radial-gradient(circle at 75% 70%,rgba(181,50,42,.28),transparent 45%),radial-gradient(circle at 50% 96%,rgba(200,155,60,.22),transparent 42%);animation:auroraMove 14s ease-in-out infinite alternate;}
  .login-dots{position:absolute;inset:0;overflow:hidden;z-index:1;}
  .login-dots span{position:absolute;border-radius:50%;opacity:.5;animation:floatDot linear infinite;}
  .brand-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .login-brand .card{position:relative;background:#fff;border:1px solid rgba(200,155,60,.30);border-radius:20px;padding:26px 38px;box-shadow:0 22px 60px rgba(0,0,0,.38);animation:floatCard 6s ease-in-out infinite;}
  .login-brand .card::before{content:"";position:absolute;inset:-2px;border-radius:22px;background:radial-gradient(circle,rgba(120,160,255,.5),transparent 70%);z-index:-1;filter:blur(14px);animation:glowPulse 4s ease-in-out infinite;}
  .login-brand .card img{width:270px;max-width:60vw;display:block;}
  .login-brand h2{font-family:var(--display);font-weight:600;font-size:23px;margin:0;text-align:center;}
  .lg-divider{width:58px;height:3px;background:var(--gold);border-radius:2px;box-shadow:0 0 12px rgba(200,155,60,.55);}
  .login-brand p{color:rgba(255,255,255,.75);font-size:13.5px;margin:0;text-align:center;max-width:340px;line-height:1.55;}
  .login-features{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:370px;}
  .login-features span{font-size:11.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(200,155,60,.38);padding:5px 11px;border-radius:20px;}
  .login-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:36px;background:var(--surface);}
  .login-box{width:100%;max-width:362px;}
  .login-logo-m{display:none;}
  .login-box .mark{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;color:#fff;margin-bottom:18px;box-shadow:0 8px 20px rgba(42,79,160,.3);}
  .login-box h1{font-family:var(--display);font-size:25px;font-weight:600;margin:0 0 6px;}
  .login-box .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:26px;}
  .login-box label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .login-box .fld{margin-bottom:16px;position:relative;}
  .login-box .fld .fico{position:absolute;left:12px;top:35px;color:var(--ink-faint);display:flex;}
  .login-box input{width:100%;font-family:var(--body);font-size:15px;padding:12px 14px 12px 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);}
  .login-box input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(42,79,160,.14);}
  .login-box .eye{position:absolute;right:8px;top:30px;cursor:pointer;background:none;border:none;font-size:16px;padding:4px 8px;}
  .login-box button.go{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(120deg,var(--brand),var(--brand-2));color:#fff;font-family:var(--body);font-weight:600;font-size:15px;cursor:pointer;margin-top:6px;transition:transform .12s,box-shadow .15s;box-shadow:0 8px 20px rgba(42,79,160,.28);}
  .login-box button.go:hover{transform:translateY(-1px);box-shadow:0 12px 26px rgba(42,79,160,.36);}
  .login-box button.go:disabled{opacity:.75;cursor:default;transform:none;box-shadow:none;}
  .login-box button.go .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:8px;animation:spin .7s linear infinite;}
  .login-msg{color:var(--red);font-size:13px;font-weight:500;min-height:18px;margin-top:12px;}
  .login-msg.lock{color:#9A6412;}
  .caps-warn{display:none;font-size:11px;font-weight:600;color:#9A6412;margin-top:6px;}
  .caps-warn::before{content:"⚠ ";}
  .login-box .fld.shake input{border-color:var(--red);box-shadow:0 0 0 3px rgba(181,50,42,.14);}
  .shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97);}
  .login-foot{margin-top:26px;font-size:11.5px;color:var(--ink-faint);text-align:center;}

  /* ---- APP (page blanche, prête à construire) ---- */
  #app{display:none;flex-direction:column;min-height:100vh;background:#fff;}
  .app-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 28px;border-bottom:1px solid var(--line);background:var(--surface);}
  .brand-mini{display:flex;align-items:center;gap:12px;min-width:0;}
  .brand-mini img{height:32px;}
  .brand-mini span{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap;}
  .top-right{display:flex;align-items:center;gap:12px;}
  #user-badge{font-size:12.5px;font-weight:600;color:var(--brand);background:var(--surface-2);border:1px solid var(--line);padding:5px 11px;border-radius:20px;white-space:nowrap;}
  #logout-btn{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);border:1px solid var(--line);padding:7px 14px;border-radius:9px;transition:border-color .15s,color .15s;}
  #logout-btn:hover{border-color:var(--brand);color:var(--brand);}
  .app-main{flex:1;background:#fff;}

  /* ---- keyframes ---- */
  @keyframes auroraMove{from{transform:translate(0,0) rotate(0);}to{transform:translate(4%,3%) rotate(8deg);}}
  @keyframes floatDot{from{transform:translateY(0);}to{transform:translateY(-115vh);}}
  @keyframes floatCard{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  @keyframes glowPulse{0%,100%{opacity:.5;}50%{opacity:.9;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes shake{10%,90%{transform:translateX(-2px);}20%,80%{transform:translateX(3px);}30%,50%,70%{transform:translateX(-6px);}40%,60%{transform:translateX(6px);}}

  /* ---- responsive ---- */
  @media (max-width:820px){
    .login-brand{display:none;}
    .login-form-side{width:100%;flex:1;padding:30px 22px;}
    .login-logo-m{display:block;width:150px;margin:0 auto 20px;}
    .app-top{padding:12px 16px;}
    .brand-mini span{display:none;}
  }
  @media (max-width:380px){
    .login-form-side{padding:24px 16px;}
    .login-box h1{font-size:22px;}
    .login-logo-m{width:130px;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>

    <div class="top-right"><span id="user-badge"></span><button id="logout-btn">Déconnexion</button></div>
  </header>
  <main class="app-main" id="app-main"><!-- Page blanche : prête à être construite --></main>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const API = '';
  let S = { auth:null };

  function roleLabel(r){ return {SUPERVISEUR:'Superviseur',MASTER:'Master',COMMERCIAL:'Commercial',PDV:'Point de vente'}[r] || r; }

  // petits points colorés qui flottent (réseaux mobile money)
  function buildDots(){
    const box = $('login-dots'); if(!box) return;
    const colors = ['#1BA9E0','#FF6A00','#F5B700','#0072BC','#B5322A','#C89B3C','#7A2F8F'];
    let h = '';
    for(let i=0;i<9;i++){
      const c=colors[i%colors.length], l=Math.random()*100, dur=9+Math.random()*10, dl=Math.random()*9, s=6+Math.random()*8;
      h += '<span style="left:'+l+'%;bottom:-20px;width:'+s+'px;height:'+s+'px;background:'+c+';animation-duration:'+dur+'s;animation-delay:'+dl+'s;"></span>';
    }
    box.innerHTML = h;
  }

  function showLogin(){ $('login-screen').style.display='block'; $('app').style.display='none'; }
  function showApp(){ $('login-screen').style.display='none'; $('app').style.display='flex'; }

  function shakeField(id){ const el=$(id).closest('.fld'); if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  function vibrate(pat){ try{ if(navigator.vibrate) navigator.vibrate(pat); }catch(e){} }
  let lockTimer=null;
  function startLock(remaining){
    clearInterval(lockTimer);
    const u=$('login-user'), p=$('login-pass'), btn=$('login-btn'), msg=$('login-msg');
    u.disabled=true; p.disabled=true; btn.disabled=true;
    const tick=()=>{
      if(remaining<=0){ clearInterval(lockTimer); u.disabled=false; p.disabled=false; btn.disabled=false; btn.textContent='Se connecter'; msg.textContent=''; msg.className='login-msg'; return; }
      const mm=String(Math.floor(remaining/60)).padStart(2,'0'), ss=String(remaining%60).padStart(2,'0');
      msg.innerHTML='🔒 Trop de tentatives. Réessaie dans <b>'+mm+':'+ss+'</b>';
      msg.className='login-msg lock';
      btn.textContent='Verrouillé';
      remaining--;
    };
    tick(); lockTimer=setInterval(tick,1000);
  }

  function setupLogin(){
    buildDots();
    $('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if($('login-btn').disabled) return;
      const msg=$('login-msg'); msg.textContent=''; msg.className='login-msg';
      const btn=$('login-btn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span>Connexion…';
      try{
        const r = await fetch(API+'/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username:$('login-user').value, password:$('login-pass').value })});
        const d = await r.json().catch(()=>({}));
        if(r.status===423){ vibrate([70,40,70]); startLock(d.remaining || 300); return; }
        if(!r.ok){
          vibrate(200); shakeField('login-user'); shakeField('login-pass');
          let t = d.error || 'Échec de connexion';
          if(typeof d.attemptsLeft==='number') t += ' — il te reste ' + d.attemptsLeft + ' tentative' + (d.attemptsLeft>1?'s':'');
          msg.textContent=t; msg.className='login-msg';
          btn.disabled=false; btn.textContent='Se connecter';
          return;
        }
        S.auth = { token:d.token, user:d.user };
        $('user-badge').textContent = d.user.username + ' · ' + roleLabel(d.user.role);
        showApp();
      }catch(err){
        vibrate(200); shakeField('login-user'); shakeField('login-pass');
        msg.textContent = err.message || 'Erreur réseau'; btn.disabled=false; btn.textContent='Se connecter';
      }
    });
    $('login-eye').addEventListener('click', () => { const p=$('login-pass'); p.type = (p.type==='password') ? 'text' : 'password'; });
    const caps = (e) => { const on = e.getModifierState && e.getModifierState('CapsLock'); $('caps-warn').style.display = on ? 'block' : 'none'; };
    $('login-pass').addEventListener('keydown', caps);
    $('login-pass').addEventListener('keyup', caps);
    $('login-user').addEventListener('keyup', caps);
    $('logout-btn').addEventListener('click', async () => {
      try{ if(S.auth) await fetch(API+'/logout', {method:'POST', headers:{'Authorization':'Bearer '+S.auth.token}}); }catch(e){}
      S.auth=null; showLogin();
      const btn=$('login-btn'); btn.disabled=false; btn.textContent='Se connecter';
      $('login-msg').textContent=''; $('login-form').reset(); $('caps-warn').style.display='none';
    });
  }

  function init(){
    setupLogin();
    // La page de connexion est toujours la première affichée, même après une actualisation.
    showLogin();
  }
  init();
</script>
</body>
</html>
